<!--
  Flytanimasjon i Canvas 2D for README (skill visuell-dokumentasjon).
  Kontrakt: window.renderFrame(t) tegner tilstanden ved t sekunder (ren funksjon),
  window.T_END er lengden, window.READY = true når fonten er lastet.
  Uten #record i URL-en spiller siden selv i løkke. ?theme=dark eller ?style=mork (fra record.js --style=mork) gir mørk variant.

  Avledet fra: backup-entrypoint.sh (main, run_backup, backup_files, upload_with_retry,
  upload_to_hetzner, cleanup_local, cleanup_hetzner, notify_ntfy) og Dockerfile (2026-10-31).
  Render: se docs/visuelt/kilder/README.md.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600&display=swap" rel="stylesheet">
<canvas id="c"></canvas>
<script>
const TITLE = 'Slik tar safekeeper en backup';

// kind: person | app | db | ekstern  (styrer form og farge)
const NODES = [
  { id: 'cron',    label: 'Planlagt kjøring', sub: 'cron, standard kl. 05:00', kind: 'app',     x: 0.09, y: 0.50 },
  { id: 'db',      label: 'PostgreSQL',       sub: 'pg_dump + gzip',          kind: 'db',      x: 0.29, y: 0.22 },
  { id: 'filer',   label: 'Filkatalog',       sub: 'tar, valgfri',            kind: 'db',      x: 0.29, y: 0.78 },
  { id: 'gpg',     label: 'GPG-kryptering',   sub: 'AES256, påkrevd',         kind: 'app',     x: 0.49, y: 0.50 },
  { id: 'sjekk',   label: 'Verifisering',     sub: 'størrelse + dekryptering', kind: 'app',    x: 0.69, y: 0.50 },
  { id: 'nas',     label: 'NAS',              sub: 'fil + SHA256, 30 dager',  kind: 'db',      x: 0.89, y: 0.22 },
  { id: 'offsite', label: 'Offsite-lagring',  sub: 'SFTP, 30 dager',          kind: 'ekstern', x: 0.89, y: 0.78 },
  { id: 'ntfy',    label: 'ntfy-varsel',      sub: 'bare ved feil',           kind: 'ekstern', x: 0.66, y: 0.86 },
];

// Hvert steg sender en «pakke» langs en kant. start og dur i sekunder.
const FLOWS = [
  { from: 'cron',  to: 'db',      start: 0.8, dur: 1.2, text: 'Cron starter jobben, og pg_dump tar ut databasen' },
  { from: 'db',    to: 'gpg',     start: 2.2, dur: 1.2, text: 'Dumpen komprimeres og krypteres med GPG' },
  { from: 'gpg',   to: 'sjekk',   start: 3.6, dur: 1.2, text: 'Fila må ha minstestørrelse og la seg dekryptere' },
  { from: 'sjekk', to: 'nas',     start: 5.0, dur: 1.2, text: 'Godkjent backup og SHA256-sum blir liggende på NAS' },
  { from: 'nas',   to: 'offsite', start: 6.4, dur: 1.2, text: 'Kopien lastes opp offsite, opptil 3 forsøk, og størrelsen sjekkes' },
  { from: 'filer', to: 'gpg',     start: 7.8, dur: 1.2, text: 'Så går filkatalogen samme vei, og det eldste ryddes bort' },
  { from: 'sjekk', to: 'ntfy',    start: 9.2, dur: 1.2, text: 'Feiler backupen, går det et ntfy-varsel med en gang' },
];
const T_END = 12;   // 1,6 s rolig slutt etter siste steg, så løkka ikke rykker

const Q = new URLSearchParams(location.search);
const DARK = Q.get('theme') === 'dark' || Q.get('style') === 'mork';
const C = DARK
  ? { bg: '#0d1b2a', box: '#1b2b3d', line: '#3a5068', text: '#e8eef4', muted: '#9fb1c3', accent: '#f2a541', db: '#24384d' }
  : { bg: '#ffffff', box: '#eef2f6', line: '#b8c4d0', text: '#0d1b2a', muted: '#5a6b7c', accent: '#d9822b', db: '#e2e9f0' };

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0;
function resize() {
  const dpr = window.devicePixelRatio || 1;
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

const byId = Object.fromEntries(NODES.map(n => [n.id, n]));
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = u => u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
const px = n => ({ x: n.x * W, y: 0.12 * H + n.y * 0.80 * H });

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

function drawNode(n, glow) {
  const { x, y } = px(n);
  const s = Math.min(W, H) / 1080;
  // Bredden følger teksten, så lange navn aldri klippes (README-GIF skaleres til ca. 960 px)
  ctx.save();
  ctx.font = `600 ${30 * s}px "DM Sans", sans-serif`;
  let tw = ctx.measureText(n.label).width;
  if (n.sub) { ctx.font = `400 ${22 * s}px "DM Sans", sans-serif`; tw = Math.max(tw, ctx.measureText(n.sub).width); }
  const w = Math.max(220 * s, tw + 44 * s), h = (n.sub ? 92 : 76) * s;
  ctx.lineWidth = (glow > 0 ? 4 : 2) * s;
  ctx.strokeStyle = glow > 0 ? C.accent : C.line;
  ctx.fillStyle = n.kind === 'db' ? C.db : C.box;
  if (n.kind === 'person') {
    ctx.beginPath(); ctx.arc(x, y, h * 0.62, 0, Math.PI * 2);
  } else if (n.kind === 'db') {
    roundRect(x - w / 2, y - h / 2, w, h, h / 2);
  } else {
    roundRect(x - w / 2, y - h / 2, w, h, 14 * s);
    if (n.kind === 'ekstern') ctx.setLineDash([8 * s, 6 * s]);
  }
  ctx.fill(); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = C.text;
  ctx.font = `600 ${30 * s}px "DM Sans", sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const ly = n.kind === 'person' ? y + h * 0.95 : y;
  if (n.sub) {
    // To linjer: navn over, frekvens eller detalj under (under boksen for person)
    ctx.fillText(n.label, x, n.kind === 'person' ? ly : ly - 15 * s);
    ctx.fillStyle = C.muted;
    ctx.font = `400 ${22 * s}px "DM Sans", sans-serif`;
    ctx.fillText(n.sub, x, n.kind === 'person' ? ly + 32 * s : ly + 20 * s);
  } else {
    ctx.fillText(n.label, x, ly);
  }
  ctx.restore();
}

function renderFrame(t) {
  const s = Math.min(W, H) / 1080;
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);

  // Tittel
  ctx.fillStyle = C.text; ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  ctx.font = `600 ${40 * s}px "DM Sans", sans-serif`;
  ctx.fillText(TITLE, 60 * s, 48 * s);

  // Kanter (unike par)
  const seen = new Set();
  for (const f of FLOWS) {
    const k = f.from + '>' + f.to; if (seen.has(k)) continue; seen.add(k);
    const a = px(byId[f.from]), b = px(byId[f.to]);
    const active = t >= f.start && t <= f.start + f.dur;
    ctx.strokeStyle = active ? C.accent : C.line;
    ctx.lineWidth = (active ? 4 : 2) * s;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }

  // Pakker (før nodene, så de glir inn under boksen)
  for (const f of FLOWS) {
    const u = (t - f.start) / f.dur;
    if (u < 0 || u > 1) continue;
    const a = px(byId[f.from]), b = px(byId[f.to]), e = ease(u);
    ctx.fillStyle = C.accent;
    ctx.beginPath(); ctx.arc(a.x + (b.x - a.x) * e, a.y + (b.y - a.y) * e, 13 * s, 0, Math.PI * 2); ctx.fill();
  }

  // Noder lyser kort når en pakke kommer fram
  for (const n of NODES) {
    let glow = 0;
    for (const f of FLOWS) {
      const arrive = f.start + f.dur;
      if (f.to === n.id && t >= arrive && t < arrive + 0.8) glow = 1;
      if (f.from === n.id && t >= f.start && t < f.start + f.dur) glow = 1;
    }
    drawNode(n, glow);
  }

  // Bildetekst: stegene som startet sist (samme start = vises sammen), tones inn og ut
  const started = FLOWS.filter(f => t >= f.start - 0.2);
  if (started.length) {
    const sNow = Math.max(...started.map(f => f.start));
    const caption = started.filter(f => f.start === sNow).map(f => f.text).join(' ');
    ctx.globalAlpha = clamp((T_END - t) / 0.6) * clamp((t - FLOWS[0].start + 0.2) / 0.4);
    ctx.fillStyle = C.muted; ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
    ctx.font = `400 ${32 * s}px "DM Sans", sans-serif`;
    ctx.fillText(caption, W / 2, H - 48 * s);
    ctx.globalAlpha = 1;
  }
}

window.renderFrame = renderFrame;
window.T_END = T_END;
resize();
window.addEventListener('resize', () => { resize(); });
document.fonts.load(`600 40px "DM Sans"`).catch(() => {}).finally(() => {
  window.READY = true;
  if (location.hash !== '#record') {
    const t0 = performance.now();
    const loop = now => { renderFrame(((now - t0) / 1000) % T_END); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  } else {
    renderFrame(0);
  }
});
</script>
